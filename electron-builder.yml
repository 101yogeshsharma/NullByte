appId: com.nullbyte.app
productName: NullByte
directories:
  output: dist
  app: .
files:
  - "main.js"
  - "preload.js"
  - "renderer/overlay.html"
  - "renderer/setup.html"
  - "renderer/settings.html"
  - "assets/icon.png"
  - "build/icon.ico"
  - "build/icon.icns"
  - "build/installer.nsh"
  - "package.json"
  - "node_modules/**/*"
win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  artifactName: NullByte-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: NullByte
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
  artifactName: NullByte-${version}-${arch}.${ext}
dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
    - x: 270
      y: 120
      type: file
      path: build/INSTALL_INSTRUCTIONS.txt
