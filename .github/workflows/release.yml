name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check & Unit Tests
        run: |
          node -c main.js
          node -c preload.js
          node -c modelCatalog.js
          node -c providerClient.js
          node -c verify_key.js
          npm test

  build-windows:
    name: Build Windows Installer
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 Installer
        run: npx electron-builder --win nsis --x64 --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep only .exe installer
        run: |
          Get-ChildItem -Path dist -File | Where-Object { $_.Extension -ne '.exe' } | Remove-Item -Force
          Get-ChildItem -Path dist -Directory | Remove-Item -Recurse -Force
          Get-ChildItem -Path dist -File | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
        shell: pwsh

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullByte-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 5

  build-macos:
    name: Build macOS DMGs
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMGs (arm64 & x64)
        run: npx electron-builder --mac dmg --arm64 --x64 --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NullByte-macOS
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: NullByte-Windows
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: NullByte-macOS
          path: dist

      - name: List release artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NullByte ${{ github.ref_name }}
          body: |
            ## NullByte ${{ github.ref_name }}

            ### 📥 Downloads
            - **Windows (x64):** Download the `.exe` installer below.
            - **macOS (Apple Silicon & Intel):** Download the `arm64.dmg` or `x64.dmg` image below.

            ### 🔑 Setup
            You can use a free **Google Gemini** API key ([Google AI Studio](https://aistudio.google.com/)), **OpenRouter** free vision models, or local **Ollama** models.

            ### 🛠️ Build from Source
            See the [README](https://github.com/101yogeshsharma/NullByte#-getting-started) for instructions.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/*.exe
            dist/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
